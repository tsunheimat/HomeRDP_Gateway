# Sanitized local Docker sample configuration.
# Do not use these placeholder values in shared or production environments.
# Replace every CHANGE_ME value through a local secret store, .env file, or
# orchestrator-managed secret before exposing the gateway beyond disposable dev.

Server:
  GatewayAddress: https://localhost:8443
  Port: 8443
  Tls: disable
  Authentication:
    - openid
  Hosts:
    - xrdp:3389
  # Use filesystem-backed sessions in the container sample. The root compose file
  # mounts /tmp as tmpfs, so session files are writable even with read_only: true.
  SessionStore: file
  SessionKey: CHANGE_ME_32_BYTES_SECRET_000001
  SessionEncryptionKey: CHANGE_ME_32_BYTES_SECRET_000002
  SecureCookies: false

OpenId:
  ProviderUrl: https://keycloak.example.invalid/realms/rdpgw
  ClientId: rdpgw
  ClientSecret: CHANGE_ME_USE_ENV_OR_SECRET_STORE

Dashboard:
  StorePath: /var/lib/rdpgw/dashboard
  AdminGroups:
    - admin

Security:
  PAATokenEncryptionKey: CHANGE_ME_32_BYTES_SECRET_000003
  PAATokenSigningKey: CHANGE_ME_32_BYTES_SECRET_000004
  VerifyClientIp: true

Caps:
  TokenAuth: true
  EnableClipboard: true
  EnableDrive: true
  EnablePrinter: true
  EnablePort: true
  EnablePnp: true

# The compose sample publishes two backend listeners. The container entrypoint
# reads this helper-only section and starts one rdpgw process for OIDC/dashboard
# traffic plus one process for direct native RDP gateway auth.
GatewaySplit:
  Enabled: true
  OIDC:
    Hostname: https://localhost:8443
    Port: 8443
  Direct:
    Hostname: https://localhost:9443
    Port: 9443
    Authentication:
      - ntlm
