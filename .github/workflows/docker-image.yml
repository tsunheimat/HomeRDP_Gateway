name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up QEMU
        # docker/setup-qemu-action@v3
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Login to Docker Hub
        # docker/login-action@v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
         username: ${{ secrets.DOCKER_USER }}
         password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        # docker/build-push-action@v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ github.repository_owner }}/rdpgw:latest
            ${{ github.repository_owner }}/rdpgw:${{ github.ref_name }}
      - name: Update Docker Hub Description
        # peter-evans/dockerhub-description@v4
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/rdpgw
          readme-filepath: ./README.md
