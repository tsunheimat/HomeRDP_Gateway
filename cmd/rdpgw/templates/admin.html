<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/assets/icon.svg">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="/assets/icon.svg" alt="Logo">
            RDP Gateway Admin
        </div>
        <div class="user-info">
            <span id="adminUsername">Loading...</span>
            <a class="admin-link" href="/">Back to Dashboard</a>
        </div>
    </div>

    <main class="main">
        <div class="container admin-container">
            <h1 class="title">Entry Administration</h1>
            <p class="subtitle">Create and manage published hosts and template-based entries.</p>

            <div class="error" id="adminError"></div>
            <div class="success" id="adminSuccess"></div>

            <div class="admin-grid">
                <section class="admin-panel">
                    <h2>Create Host Entry</h2>
                    <form id="hostForm" class="stack-form">
                        <label>
                            Name
                            <input type="text" name="name" required>
                        </label>
                        <label>
                            Description
                            <input type="text" name="description">
                        </label>
                        <label>
                            Allowed Groups (comma separated)
                            <input type="text" name="allowedGroups" placeholder="homelab-users,rdpgw-admins" required>
                        </label>
                        <label>
                            Host (host:port)
                            <input type="text" name="host" placeholder="lab.internal:3389" required>
                        </label>
                        <button type="submit" class="primary-button">Create Host Entry</button>
                    </form>
                </section>

                <section class="admin-panel">
                    <h2>Create Template Entry</h2>
                    <form id="templateForm" class="stack-form" enctype="multipart/form-data">
                        <label>
                            Name
                            <input type="text" name="name" required>
                        </label>
                        <label>
                            Description
                            <input type="text" name="description">
                        </label>
                        <label>
                            Allowed Groups (comma separated)
                            <input type="text" name="allowedGroups" placeholder="homelab-users,rdpgw-admins" required>
                        </label>
                        <label>
                            Target Host Override (optional)
                            <input type="text" name="targetHostOverride" placeholder="app.internal:3389">
                        </label>
                        <label>
                            RDP Template File
                            <input type="file" name="template" accept=".rdp" required>
                        </label>
                        <button type="submit" class="primary-button">Upload Template Entry</button>
                    </form>
                </section>

                <section class="admin-panel">
                    <h2>Create Direct Auth User</h2>
                    <form id="authUserForm" class="stack-form">
                        <label>
                            Username
                            <input type="text" name="username" required>
                        </label>
                        <label>
                            Password
                            <input type="password" name="password" required>
                        </label>
                        <label class="checkbox-row">
                            <input type="checkbox" name="enabled" checked>
                            Enabled
                        </label>
                        <button type="submit" class="primary-button">Create Direct Auth User</button>
                    </form>
                </section>
            </div>

            <section class="admin-panel">
                <h2>Current Entries</h2>
                <div id="adminEntries"></div>
            </section>

            <section class="admin-panel">
                <h2>Current Direct Auth Users</h2>
                <div id="adminAuthUsers"></div>
            </section>
        </div>
    </main>

    <script src="/static/admin.js"></script>
</body>
</html>
